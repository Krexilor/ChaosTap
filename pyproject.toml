[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chaostap"
dynamic = ["version"]
description = "Async network fault-injection and chaos proxy with a FastAPI control plane."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krexilor" }]
keywords = ["chaos-engineering", "fault-injection", "proxy", "asyncio", "resilience-testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
    "Typing :: Typed"
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "h11>=0.14"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10"
]

[project.scripts]
chaostap = "chaostap.cli:main"

[project.urls]
Homepage = "https://github.com/Krexilor/chaostap"
Issues = "https://github.com/Krexilor/chaostap/issues"

# Build --------------------------------------------------------------------------------------------------------------------------------------------|
[tool.hatch.version]
path = "src/chaostap/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chaostap"]

[tool.hatch.build.targets.sdist]
include = ["src/chaostap", "tests", "docs", "examples", "README.md", "LICENSE"]

# Ruff ---------------------------------------------------------------------------------------------------------------------------------------------|
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "ASYNC",    # async pitfalls
    "S",        # bandit (security)
    "PT",       # pytest style
    "RUF"       # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104"]
"benchmarks/**" = ["S101", "S104"]
"examples/**" = ["S104"]

[tool.ruff.format]
quote-style = "double"

# Mypy ---------------------------------------------------------------------------------------------------------------------------------------------|
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

# Pytest -------------------------------------------------------------------------------------------------------------------------------------------|
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that start a real proxy and upstream"
]

# Coverage -----------------------------------------------------------------------------------------------------------------------------------------|
[tool.coverage.run]
source = ["chaostap"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
